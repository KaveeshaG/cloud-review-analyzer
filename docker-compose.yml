version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: review-analyzer-api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - REVIEW_INGESTION_URL=http://review-ingestion:8081
      - ANALYTICS_URL=http://analytics:8083
      - PROJECT_ID=${PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    volumes:
      - ./services/api-gateway/src:/app/src
      - ./credentials:/app/credentials:ro
      - api-gateway-node-modules:/app/node_modules
    networks:
      - review-analyzer-network
    depends_on:
      - review-ingestion
      - analytics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Review Ingestion Service
  review-ingestion:
    build:
      context: ./services/review-ingestion
      dockerfile: Dockerfile
    container_name: review-analyzer-review-ingestion
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NODE_ENV=development
      - PROJECT_ID=${PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
      - REVIEW_BUCKET=${REVIEW_BUCKET}
      - PUBSUB_TOPIC=${PUBSUB_TOPIC}
    volumes:
      - ./services/review-ingestion/src:/app/src
      - ./credentials:/app/credentials:ro
      - review-ingestion-node-modules:/app/node_modules
    networks:
      - review-analyzer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Analysis Service
  ai-analysis:
    build:
      context: ./services/ai-analysis
      dockerfile: Dockerfile
    container_name: review-analyzer-ai-analysis
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NODE_ENV=development
      - PROJECT_ID=${PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PUBSUB_SUBSCRIPTION=${PUBSUB_SUBSCRIPTION}
      - PUBSUB_TOPIC=${PUBSUB_TOPIC}
    volumes:
      - ./services/ai-analysis/src:/app/src
      - ./credentials:/app/credentials:ro
      - ai-analysis-node-modules:/app/node_modules
    networks:
      - review-analyzer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Analytics Service
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: review-analyzer-analytics
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - NODE_ENV=development
      - PROJECT_ID=${PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
    volumes:
      - ./services/analytics/src:/app/src
      - ./credentials:/app/credentials:ro
      - analytics-node-modules:/app/node_modules
    networks:
      - review-analyzer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  review-analyzer-network:
    driver: bridge
    name: review-analyzer-network

volumes:
  api-gateway-node-modules:
  review-ingestion-node-modules:
  ai-analysis-node-modules:
  analytics-node-modules: